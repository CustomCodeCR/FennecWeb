name: Deploy FennecWeb - develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fennecweb-develop-deploy
  cancel-in-progress: true

env:
  IMAGE_NAME: valehttps30/fennecweb
  IMAGE_TAG: latest
  COMPOSE_FILE: /opt/dhole/docker-compose.services.yml
  SERVICE_NAME: website
  PUBLIC_HOST: website-castrofallas.customcodecr.com

jobs:
  deploy:
    name: Build and deploy on dhole-server
    runs-on: [self-hosted, linux, x64, dhole]

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Verify server prerequisites
        shell: bash
        run: |
          set -euo pipefail

          docker version
          docker compose version
          docker network inspect dhole >/dev/null

          if [ ! -r "$COMPOSE_FILE" ]; then
            echo "ERROR: $COMPOSE_FILE does not exist or is not readable by $(whoami)."
            exit 1
          fi

          docker compose -f "$COMPOSE_FILE" config -q

      - name: Build Docker image on server
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::12}"

          docker build \
            --pull \
            -f dockerfile \
            -t "$IMAGE_NAME:$IMAGE_TAG" \
            -t "$IMAGE_NAME:$SHORT_SHA" \
            .

          docker image inspect "$IMAGE_NAME:$IMAGE_TAG" >/dev/null
          echo "Built $IMAGE_NAME:$IMAGE_TAG"
          echo "Built $IMAGE_NAME:$SHORT_SHA"

      - name: Replace website container
        shell: bash
        run: |
          set -euo pipefail

          echo "Stopping Compose service if it is currently managed by this compose file..."
          docker compose -f "$COMPOSE_FILE" stop "$SERVICE_NAME" 2>/dev/null || true

          echo "Removing any existing container named $SERVICE_NAME..."
          if docker container inspect "$SERVICE_NAME" >/dev/null 2>&1; then
            docker rm -f "$SERVICE_NAME"
          fi

          echo "Starting $SERVICE_NAME with the image built on this server..."
          docker compose -f "$COMPOSE_FILE" up -d \
            --no-deps \
            --force-recreate \
            --pull never \
            "$SERVICE_NAME"

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          docker compose -f "$COMPOSE_FILE" ps "$SERVICE_NAME"

          RUNNING="$(docker inspect -f '{{.State.Running}}' "$SERVICE_NAME")"
          if [ "$RUNNING" != "true" ]; then
            echo "ERROR: $SERVICE_NAME is not running."
            docker logs --tail 100 "$SERVICE_NAME" || true
            exit 1
          fi

          DEPLOYED_IMAGE="$(docker inspect -f '{{.Config.Image}}' "$SERVICE_NAME")"
          echo "Running image: $DEPLOYED_IMAGE"

          for attempt in {1..12}; do
            if curl -fsS \
              -H "Host: $PUBLIC_HOST" \
              http://127.0.0.1/ >/dev/null; then
              echo "Deployment is responding through Traefik."
              exit 0
            fi

            echo "Waiting for website... attempt $attempt/12"
            sleep 5
          done

          echo "ERROR: Website did not respond through Traefik."
          docker logs --tail 100 "$SERVICE_NAME" || true
          exit 1

      - name: Cleanup old build images
        if: success()
        shell: bash
        run: |
          docker image prune -f
