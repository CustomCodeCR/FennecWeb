name: Deploy FennecWeb - develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fennecweb-develop-deploy
  cancel-in-progress: true

env:
  IMAGE_NAME: valehttps30/fennecweb
  IMAGE_TAG: latest
  COMPOSE_FILE: /opt/dhole/docker-compose.services.yml
  SERVICE_NAME: website
  PUBLIC_HOST: website-castrofallas.customcodecr.com

jobs:
  deploy:
    name: Build and deploy on dhole-server
    runs-on: [self-hosted, linux, x64, dhole]

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Verify server prerequisites
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker network inspect dhole >/dev/null

          if [ ! -r "$COMPOSE_FILE" ]; then
            echo "ERROR: $COMPOSE_FILE does not exist or is not readable by $(whoami)."
            echo "Grant the actions-runner user read access to the compose file and execute access to its parent directory."
            exit 1
          fi

          docker compose -f "$COMPOSE_FILE" config -q

      - name: Build Docker image on server
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"

          docker build \
            --pull \
            -f dockerfile \
            -t "$IMAGE_NAME:$IMAGE_TAG" \
            -t "$IMAGE_NAME:$SHORT_SHA" \
            .

          docker image inspect "$IMAGE_NAME:$IMAGE_TAG" >/dev/null
          echo "Built $IMAGE_NAME:$IMAGE_TAG ($SHORT_SHA)"

      - name: Deploy website with docker-compose.services.yml
        shell: bash
        run: |
          set -euo pipefail

          docker compose -f "$COMPOSE_FILE" up -d \
            --no-deps \
            --force-recreate \
            --pull never \
            "$SERVICE_NAME"

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          docker compose -f "$COMPOSE_FILE" ps "$SERVICE_NAME"

          for attempt in {1..12}; do
            if curl -fsS \
              -H "Host: $PUBLIC_HOST" \
              http://127.0.0.1/ >/dev/null; then
              echo "Deployment is responding through Traefik."
              exit 0
            fi

            echo "Waiting for website... attempt $attempt/12"
            sleep 5
          done

          echo "ERROR: Website did not respond through Traefik."
          docker logs --tail 100 "$SERVICE_NAME" || true
          exit 1
