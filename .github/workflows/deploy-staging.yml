name: Deploy Fennec Web - Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fennec-web-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]

    steps:
      - name: Checkout Fennec
        uses: actions/checkout@v4

      - name: Use staging server configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "COMPOSE_FILE=/opt/dhole/docker-compose.services.yml" >> "$GITHUB_ENV"
          echo "COMPOSE_OVERRIDE=/opt/dhole/docker-compose.staging.yml" >> "$GITHUB_ENV"
          echo "DHOLE_ENV_FILE=/opt/dhole/.env.staging" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT=dhole-staging" >> "$GITHUB_ENV"
          echo "DHOLE_NETWORK=dhole-staging" >> "$GITHUB_ENV"
          echo "FENNEC_IMAGE_TAG=staging" >> "$GITHUB_ENV"

      - name: Verify staging server
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker network inspect "$DHOLE_NETWORK" >/dev/null
          test -r "$DHOLE_ENV_FILE"
          test -r "$COMPOSE_FILE"
          test -r "$COMPOSE_OVERRIDE"
          FENNEC_IMAGE_TAG="$FENNEC_IMAGE_TAG" docker compose \
            --env-file "$DHOLE_ENV_FILE" \
            -f "$COMPOSE_FILE" \
            -f "$COMPOSE_OVERRIDE" \
            -p "$COMPOSE_PROJECT" \
            config -q

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull \
            -f Dockerfile \
            -t fennec/web:staging \
            -t "fennec/web:staging-$SHA_TAG" \
            .

      - name: Deploy Fennec staging
        shell: bash
        run: |
          set -euo pipefail
          export FENNEC_IMAGE_TAG=staging
          docker compose \
            --env-file "$DHOLE_ENV_FILE" \
            -f "$COMPOSE_FILE" \
            -f "$COMPOSE_OVERRIDE" \
            -p "$COMPOSE_PROJECT" \
            up -d --no-deps --force-recreate --pull never website

          container_id="$(docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" ps -q website)"
          test -n "$container_id"

          for attempt in $(seq 1 30); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
            if [[ "$health" == "healthy" || "$health" == "running" ]]; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs --tail 100 "$container_id"
              exit 1
            fi
            sleep 2
          done

          docker exec "$container_id" wget -qO- http://127.0.0.1/health | grep -qx 'ok'

      - name: Verify staging route through Traefik
        shell: bash
        run: |
          set -euo pipefail
          host="$(grep -m1 '^FENNEC_HOST=' "$DHOLE_ENV_FILE" | cut -d= -f2- | tr -d '\r')"
          test -n "$host"
          code="$(curl -sS -o /tmp/fennec-stage-health -w '%{http_code}' -H "Host: $host" http://127.0.0.1/health || true)"
          echo "$host/health -> HTTP $code"
          [[ "$code" =~ ^2[0-9][0-9]$ || "$code" =~ ^3[0-9][0-9]$ ]]

      - name: Cleanup old images
        continue-on-error: true
        run: docker image prune -f
